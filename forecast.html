<!doctype html>
<html data-theme="sunny">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micromobility Demand Forecast</title>
  <link rel="stylesheet" href="https://steveneedham.github.io/design-system/styles.css">
  <link rel="stylesheet" href="https://steveneedham.github.io/design-system/sunny.css">
  <style>
    .dashboard {
      padding: 2rem var(--space-page-x);
      max-width: 1200px;
      margin: 0 auto;
    }

    .dashboard-header {
      margin-bottom: 3rem;
    }

    .dashboard-header .eyebrow {
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: var(--text-eyebrow);
      letter-spacing: var(--tracking-eyebrow);
      text-transform: uppercase;
      margin-bottom: 1rem;
      border: none;
    }

    .dashboard-header h1 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: var(--text-h2);
      margin: 0;
      color: var(--text);
    }

    .dashboard-header p {
      color: var(--muted);
      margin-top: 0.8rem;
      max-width: 60ch;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 1.5rem;
      margin-bottom: 3rem;
      padding: 2rem;
      background: var(--panel);
      border: 2px solid var(--amber);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 12px rgba(244, 165, 56, 0.1);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .control-group label {
      font-family: var(--font-mono);
      font-size: var(--text-mono-sm);
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--amber);
      font-weight: 600;
    }

    .control-group input,
    .control-group select {
      padding: 0.75rem;
      border: 2px solid var(--panel-line);
      border-radius: var(--radius-sm);
      background: var(--ink);
      color: var(--text);
      font-family: var(--font-body);
      font-size: var(--text-body);
      transition: border-color var(--motion-fast);
    }

    .control-group input:focus,
    .control-group select:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(244, 165, 56, 0.1);
    }

    .predict-btn {
      align-self: flex-end;
      padding: 0.75rem 1.8rem;
      background: var(--amber);
      color: var(--ink);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: var(--text-mono-sm);
      font-weight: 700;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--motion-fast);
      box-shadow: 0 4px 12px rgba(244, 165, 56, 0.2);
    }

    .predict-btn:hover {
      background: #f0b04f;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(244, 165, 56, 0.3);
    }

    .predict-btn:active {
      transform: translateY(0);
    }

    .predict-btn.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .forecast-card {
      background: var(--panel);
      border: 2px solid var(--amber);
      border-radius: var(--radius-md);
      padding: 2rem;
      box-shadow: 0 4px 12px rgba(244, 165, 56, 0.1);
    }

    .forecast-card .eyebrow {
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: var(--text-mono-xs);
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      margin-bottom: 1rem;
      border: none;
    }

    .forecast-card h2 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: var(--text-h3);
      margin: 0 0 1.5rem;
      color: var(--text);
    }

    .chart-container {
      width: 100%;
      height: 300px;
      background: rgba(244, 165, 56, 0.02);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: 0.5rem;
      padding: 1rem;
      box-sizing: border-box;
    }

    .chart-bar {
      flex: 1;
      background: var(--amber);
      border-radius: var(--radius-xs);
      min-height: 20px;
      transition: all var(--motion-fast);
      cursor: pointer;
      position: relative;
    }

    .chart-bar:hover {
      background: #f0b04f;
      opacity: 0.9;
    }

    .chart-bar.sys {
      background: var(--teal);
    }

    .chart-bar.sys:hover {
      background: #1F7A7E;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--panel-line);
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-label {
      font-family: var(--font-mono);
      font-size: var(--text-mono-sm);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.5rem;
      color: var(--amber);
    }

    .stat-value.sys {
      color: var(--teal);
    }

    .stat-change {
      font-family: var(--font-mono);
      font-size: var(--text-mono-xs);
      color: var(--muted);
    }

    .insights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .insight {
      background: var(--panel);
      border: 2px solid var(--amber);
      border-left: 4px solid var(--amber);
      border-radius: var(--radius-sm);
      padding: 1.5rem;
      box-shadow: 0 4px 12px rgba(244, 165, 56, 0.1);
    }

    .insight.sys {
      border-color: var(--teal);
      border-left-color: var(--teal);
    }

    .insight-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .insight-icon {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .insight.ops .insight-icon {
      background: var(--amber);
    }

    .insight.sys .insight-icon {
      background: var(--teal);
    }

    .insight h3 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--text-h4);
      margin: 0;
      color: var(--text);
    }

    .insight p {
      font-size: var(--text-body-sm);
      color: var(--muted);
      margin: 0.8rem 0 0;
      line-height: var(--leading-body);
    }

    .no-data {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--muted);
    }

    .no-data p {
      margin: 0;
      font-size: var(--text-body);
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .forecast-grid {
        grid-template-columns: 1fr;
      }

      .insights {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="nav">
    <div class="nav-name">Micromobility Lab</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="#forecast">Forecast</a>
      <a href="https://github.com/steveneedham/urban-transit-lab-predictor" target="_blank">GitHub</a>
    </div>
  </div>

  <div class="dashboard">
    <div class="dashboard-header">
      <div class="eyebrow">Demand Intelligence</div>
      <h1>Micromobility Forecast</h1>
      <p>Predict bike/scooter demand using historical GBFS data, weather patterns, and event signals.</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="forecastDate">Forecast Date</label>
        <input type="date" id="forecastDate">
      </div>
      <div class="control-group">
        <label for="forecastType">Prediction Type</label>
        <select id="forecastType">
          <option value="total">Total Trips</option>
          <option value="station">Station Availability</option>
          <option value="geographic">Geographic Hotspots</option>
        </select>
      </div>
      <button class="predict-btn" id="predictBtn">Run Forecast</button>
    </div>

    <div id="forecastResults">
      <div class="no-data">
        <p>Select a date and click "Run Forecast" to generate predictions.</p>
      </div>
    </div>
  </div>

  <script>
    const predictBtn = document.getElementById('predictBtn');
    const forecastDateInput = document.getElementById('forecastDate');
    const forecastTypeSelect = document.getElementById('forecastType');
    const resultsContainer = document.getElementById('forecastResults');

    // Set default date to tomorrow
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    forecastDateInput.valueAsDate = tomorrow;

    // Mock forecast data generator
    function generateMockForecast(date, type) {
      const dayOfWeek = new Date(date).getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const baselineMultiplier = isWeekend ? 1.3 : 1.0;

      // Hourly demand pattern
      const hours = Array.from({ length: 24 }, (_, i) => {
        const hour = i;
        const isMorning = hour >= 6 && hour < 10;
        const isEvening = hour >= 16 && hour < 19;
        const isLate = hour >= 20 || hour < 6;

        let demand = 100;
        if (isMorning) demand = 280;
        if (isEvening) demand = 320;
        if (hour === 12) demand = 210;
        if (isLate) demand = 40;

        return {
          hour: `${hour.toString().padStart(2, '0')}:00`,
          demand: Math.round(demand * baselineMultiplier + Math.random() * 30),
          confidence: 0.92 + Math.random() * 0.06
        };
      });

      const totalDemand = Math.round(hours.reduce((sum, h) => sum + h.demand, 0));
      const peakHour = hours.reduce((max, h) => h.demand > max.demand ? h : max);

      return {
        date: date.toLocaleDateString(),
        dayType: isWeekend ? 'Weekend' : 'Weekday',
        totalTrips: totalDemand,
        peakHour: peakHour.hour,
        peakDemand: peakHour.demand,
        avgConfidence: parseFloat((0.90 + Math.random() * 0.08).toFixed(2)),
        hours: hours,
        hotspots: [
          { name: 'Downtown Core', demand: Math.round(totalDemand * 0.35), change: '+12%' },
          { name: 'University District', demand: Math.round(totalDemand * 0.22), change: '+5%' },
          { name: 'Transit Hubs', demand: Math.round(totalDemand * 0.18), change: '-3%' },
          { name: 'Residential East', demand: Math.round(totalDemand * 0.12), change: '+8%' }
        ]
      };
    }

    function renderForecast(forecast) {
      const maxDemand = Math.max(...forecast.hours.map(h => h.demand));

      const chartBars = forecast.hours.map(h => {
        const height = (h.demand / maxDemand) * 100;
        return `
          <div class="chart-bar" style="height: ${height}%" title="${h.hour}: ${h.demand} trips"></div>
        `;
      }).join('');

      const hotspotsHtml = forecast.hotspots.map((spot, i) => {
        const barHeight = (spot.demand / forecast.totalTrips) * 100;
        return `
          <div class="stat-row">
            <div>
              <div class="stat-label">${spot.name}</div>
              <div style="margin-top: 0.4rem; font-size: var(--text-body-sm); color: var(--muted);">${spot.change}</div>
            </div>
            <div class="stat-value">${spot.demand}</div>
          </div>
        `;
      }).join('');

      resultsContainer.innerHTML = `
        <div class="forecast-grid">
          <div class="forecast-card">
            <div class="eyebrow">Hourly Pattern</div>
            <h2>24-Hour Forecast</h2>
            <div class="chart-container">
              ${chartBars}
            </div>
            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--panel-line);">
              <div class="stat-row">
                <span class="stat-label">Peak Hour</span>
                <span class="stat-value">${forecast.peakHour}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Peak Demand</span>
                <span class="stat-value">${forecast.peakDemand}</span>
              </div>
            </div>
          </div>

          <div class="forecast-card">
            <div class="eyebrow">Summary</div>
            <h2>Key Metrics</h2>
            <div class="stat-row">
              <span class="stat-label">Forecast Date</span>
              <span style="font-family: var(--font-body); color: var(--text);">${forecast.date}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Day Type</span>
              <span style="font-family: var(--font-body); color: var(--text);">${forecast.dayType}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Total Trips</span>
              <span class="stat-value">${forecast.totalTrips.toLocaleString()}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Confidence</span>
              <span class="stat-value">${(forecast.avgConfidence * 100).toFixed(0)}%</span>
            </div>
          </div>
        </div>

        <div class="forecast-card" style="margin-bottom: 2rem;">
          <div class="eyebrow">Geographic</div>
          <h2>Demand by Zone</h2>
          <div>${hotspotsHtml}</div>
        </div>

        <div class="insights">
          <div class="insight ops">
            <div class="insight-header">
              <div class="insight-icon"></div>
              <h3>Morning Surge</h3>
            </div>
            <p>Expect peak commute demand 6–10 AM with ${forecast.peakDemand} trips during the busiest hour. Plan for station rebalancing.</p>
          </div>

          <div class="insight sys">
            <div class="insight-header">
              <div class="insight-icon"></div>
              <h3>Network Readiness</h3>
            </div>
            <p>Confidence level at ${(forecast.avgConfidence * 100).toFixed(0)}%. Forecast based on 90+ days of historical GBFS data and weather signals.</p>
          </div>

          <div class="insight ops">
            <div class="insight-header">
              <div class="insight-icon"></div>
              <h3>Zone Focus</h3>
            </div>
            <p>Downtown Core accounts for ${Math.round((forecast.hotspots[0].demand / forecast.totalTrips) * 100)}% of predicted demand. Deploy resources accordingly.</p>
          </div>

          <div class="insight sys">
            <div class="insight-header">
              <div class="insight-icon"></div>
              <h3>Data Quality</h3>
            </div>
            <p>Prediction includes weather patterns, day-of-week effects, and recurring event signals. No major events detected for this date.</p>
          </div>
        </div>
      `;
    }

    predictBtn.addEventListener('click', () => {
      const selectedDate = forecastDateInput.valueAsDate;
      if (!selectedDate) return;

      predictBtn.classList.add('loading');
      predictBtn.textContent = 'Generating...';

      // Simulate API call
      setTimeout(() => {
        const forecast = generateMockForecast(selectedDate);
        renderForecast(forecast);
        predictBtn.classList.remove('loading');
        predictBtn.textContent = 'Run Forecast';
      }, 800);
    });
  </script>
</body>
</html>
